[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "axai-toolkit"
version = "0.1.0"
description = "A teaching-oriented Explainable AI (XAI) toolkit for undergraduate courses."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AXAI Course Team" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "Pillow>=9.0",
    "streamlit>=1.20",
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.scripts]
axai = "axai_toolkit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
deep = ["torch>=1.13", "torchvision>=0.14"]

[tool.setuptools.packages.find]
include = ["axai*", "axai_toolkit*"]
