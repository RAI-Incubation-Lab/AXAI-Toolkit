name: AXAI toolkit checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: ${{ matrix.python-version }}}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lock.txt pytest
      - run: python -m pytest -q
      - run: python build_execution_evidence.py
      - run: python render_run_docs.py
      - run: git diff --exit-code -- "*:RUN_EVIDENCE.md" "*:outputs/metrics.json" "*:outputs/representative_evidence.json"
      - run: python axai_harness.py audit-all